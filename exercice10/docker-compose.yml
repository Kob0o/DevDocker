services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_PATH: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
    restart: on-failure

volumes:
  pg_data:
  uploads:
