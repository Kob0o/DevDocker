# docker compose -f compose.yml -f compose.hardened.yml up -d --wait

services:
  api:
    pull_policy: missing
    build: !reset null
    image: ${REGISTRY}/shopapi:${VERSION}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    pull_policy: missing
    build: !reset null
    image: ${REGISTRY}/shop-worker:${VERSION}
    user: "1000:1000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql:uid=70,gid=70,mode=0770
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  redis:
    user: "999:999"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 64
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  traefik:
    volumes: !reset []
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
    networks:
      - socket
    depends_on:
      socket-proxy:
        condition: service_started

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 64
    networks:
      - socket

networks:
  socket:
    internal: true
